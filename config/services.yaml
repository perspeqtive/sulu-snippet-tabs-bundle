# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:

    perspeqtive_sulu_snippet_tabs.tabs.tab_config_collection_provider:
        class: PERSPEQTIVE\SuluSnippetTabsBundle\Tabs\TabConfigCollectionProvider
        arguments:
            $tabConfigs: '%sulu_snippet_tabs.configuration%'

    perspeqtive_sulu_snippet_tabs.admin.configured_snippet_tab_admin:
        class: PERSPEQTIVE\SuluSnippetTabsBundle\Admin\ConfiguredSnippetTabAdmin
        arguments:
            $viewBuilderFactory: '@sulu_admin.view_builder_factory'
            $tabConfigCollectionProvider: '@perspeqtive_sulu_snippet_tabs.tabs.tab_config_collection_provider'
            $toolbarActionsBuilder: '@PERSPEQTIVE\SuluSnippetTabsBundle\Admin\ToolbarActionsBuilder'
            $securityChecker: '@sulu_security.security_checker'
        tags:
            - { name: 'sulu.admin' }
            - { name: 'sulu.context', context: 'admin' }

    PERSPEQTIVE\SuluSnippetTabsBundle\Content\TabFormFieldProvider:
        class: PERSPEQTIVE\SuluSnippetTabsBundle\Content\TabFormFieldProvider
        arguments:
            $tabConfigCollectionProvider: '@perspeqtive_sulu_snippet_tabs.tabs.tab_config_collection_provider'
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'

    PERSPEQTIVE\SuluSnippetTabsBundle\Content\DataMapper:
        class: PERSPEQTIVE\SuluSnippetTabsBundle\Content\DataMapper
        arguments:
            $tabFormFieldProvider: '@PERSPEQTIVE\SuluSnippetTabsBundle\Content\TabFormFieldProvider'
        tags:
            - { name: 'sulu_content.data_mapper', priority: 64 }

    PERSPEQTIVE\SuluSnippetTabsBundle\Content\Resolver:
        class: PERSPEQTIVE\SuluSnippetTabsBundle\Content\Resolver
        arguments:
            $tabFormFieldProvider: '@PERSPEQTIVE\SuluSnippetTabsBundle\Content\TabFormFieldProvider'
            $metadataResolver: '@sulu_content.metadata_resolver'
        tags:
            - { name: 'sulu_content.content_resolver', type: 'tabs' }

    PERSPEQTIVE\SuluSnippetTabsBundle\Admin\ToolbarActionsBuilder:
        class: PERSPEQTIVE\SuluSnippetTabsBundle\Admin\ToolbarActionsBuilder
